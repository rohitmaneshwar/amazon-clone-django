{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 mb-5 text-center">
    <div class="d-flex justify-content-center mb-3">
        <div class="rounded-circle d-flex align-items-center justify-content-center" style="width: 80px; height: 80px; border: 4px solid #067d62;">
            <span style="color: #067d62; font-size: 40px; font-weight: bold;">✓</span>
        </div>
    </div>
    <h2 class="text-success fw-bold" style="color: #067d62 !important;">Order placed, thank you!</h2>
    <p class="fs-5 mt-3">Confirmation will be sent to your email.</p>
    <p class="text-muted">Your order will be delivered to Balaghat soon.</p>
    
    <a href="{% url 'home' %}" class="btn mt-4 px-5 py-2 fw-bold" style="background-color: #ffd814; border-color: #fcd200; border-radius: 8px;">Continue Shopping</a>
</div>
{% endblock content %}
