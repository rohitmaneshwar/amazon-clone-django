<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Rohit's Mart</title>
    <style>
      body {
        background-color: #f1f5f9;
        font-family: 'Segoe UI', Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 30px;
        margin: 0;
      }
      .logo-container {
        margin-bottom: 20px;
      }
      .logo-text {
        font-size: 32px;
        font-weight: bold;
        color: #1e293b;
        text-decoration: none;
      }
      .login-box {
        width: 350px;
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 30px;
        box-sizing: border-box;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      }
      .login-box h1 { font-size: 24px; font-weight: 600; margin-top: 0; margin-bottom: 20px; }
      .form-label { font-size: 13px; font-weight: 600; margin-bottom: 5px; display: block; color: #333; }
      .form-control {
        width: 100%; padding: 8px 10px; margin-bottom: 20px;
        border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; height: 35px; outline: none;
      }
      .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 3px 1px rgba(59, 130, 246, 0.3); }
      .btn-continue {
        width: 100%; background-color: #3b82f6; color: white; font-weight: bold;
        border: none; border-radius: 4px; padding: 10px; cursor: pointer; font-size: 14px;
      }
      .btn-continue:hover { background-color: #2563eb; }
      .legal-text { font-size: 12px; margin-top: 20px; color: #555; }
      .legal-text a { color: #0284c7; text-decoration: none; }
      .legal-text a:hover { text-decoration: underline; }
      .divider { display: flex; align-items: center; text-align: center; color: #777; font-size: 12px; margin: 20px 0; width: 350px; }
      .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #ddd; }
      .divider:not(:empty)::before { margin-right: 0.5em; }
      .divider:not(:empty)::after { margin-left: 0.5em; }
      .btn-create {
        width: 350px; background-color: white; color: #333; border: 1px solid #ccc;
        border-radius: 4px; padding: 10px; cursor: pointer; font-size: 14px; font-weight: 500;
      }
      .btn-create:hover { background-color: #f8f9fa; }
      .error-msg { color: #dc2626; font-size: 13px; margin-bottom: 15px; font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="logo-container">
      <a href="/" class="logo-text">🛒 Rohit's Mart</a>
    </div>

    <div class="login-box">
      <h1>Sign in</h1>

      {% if error %}
        <div class="error-msg">⚠️ {{ error }}</div>
      {% endif %}

      <div style="background-color: #e0f2fe; color: #0369a1; padding: 10px; text-align: center; margin-bottom: 15px; border-radius: 5px; font-size: 13px;">
        <strong>Portfolio Project:</strong> This is a dummy E-commerce site. Please do not use real passwords.
      </div>

      <form method="POST">
        {% csrf_token %}
        <label class="form-label">Email or mobile phone number</label>
        <input type="text" name="username" class="form-control" required />

        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required />

        <button type="submit" class="btn-continue">Continue</button>
      </form>

      <p class="legal-text">
        By continuing, you agree to Rohit's Mart <a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a>.
      </p>
    </div>

    <div class="divider">New to Rohit's Mart?</div>
    <button class="btn-create" onclick="window.location.href='{% url 'signup' %}'">Create your account</button>
  </body>
</html>
